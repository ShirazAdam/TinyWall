name: .NET 10 Desktop

on:
  push:
    branches: [ "upgrade-to-NET10", "master" ]
  pull_request:
    branches: [ "upgrade-to-NET10", "master" ]

permissions:
  contents: read

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Validate MSI project and application packaging checks
      shell: pwsh
      run: .\installer\build-package.ps1 -SelfTest

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Build Modern TinyWall
      run: dotnet build ModernTinyWall\ModernTinyWall.csproj --configuration ${{ matrix.configuration }}

    - name: Build TinyWall
      run: msbuild TinyWall\TinyWall.csproj /restore /p:Configuration=${{ matrix.configuration }} /p:Platform="Any CPU"

    - name: Test
      run: dotnet test ModernTinyWall.Exceptions.Tests\ModernTinyWall.Exceptions.Tests.csproj --configuration ${{ matrix.configuration }} --filter 'TestCategory!=LiveETW'

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Read and validate release version
      id: version
      shell: pwsh
      run: |
        [xml]$project = Get-Content ModernTinyWall\ModernTinyWall.csproj -Raw
        $version = $project.Project.PropertyGroup |
          Where-Object { $_.Version } |
          Select-Object -First 1 -ExpandProperty Version
        if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
          throw "ModernTinyWall.csproj must define a valid release version."
        }

        foreach ($projectFile in Get-ChildItem -Path . -Filter *.csproj -Recurse) {
          [xml]$library = Get-Content $projectFile.FullName -Raw
          if ($library.Project.PropertyGroup.IsPackable -contains 'false') {
            continue
          }
          $projectVersion = $library.Project.PropertyGroup |
            Where-Object { $_.Version } |
            Select-Object -First 1 -ExpandProperty Version
          if ($projectVersion -ne $version) {
            throw "$($projectFile.Name) must use release version '$version', not '$projectVersion'."
          }
        }

        $existingTag = git tag --list $version
        if ($existingTag) {
          $tagCommit = git rev-list -n 1 $version
          if ($tagCommit -ne $env:GITHUB_SHA) {
            throw "Release tag '$version' already points to another commit. Bump the project version before releasing again."
          }
        }

        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

    - name: Publish application archives (not MSI installers)
      id: package
      shell: pwsh
      run: |
        .\installer\build-package.ps1 -Architecture All
        $assets = @(
          Get-ChildItem artifacts\release\*.zip -File | ForEach-Object { $_.FullName }
          Get-ChildItem artifacts\release\*.zip.sha256 -File | ForEach-Object { $_.FullName }
        )
        if (-not $assets) {
          throw "Packaging produced no release assets."
        }
        Add-Content -Path $env:GITHUB_OUTPUT -Value "files<<ASSETS"
        $assets | ForEach-Object { Add-Content -Path $env:GITHUB_OUTPUT -Value $_ }
        Add-Content -Path $env:GITHUB_OUTPUT -Value "ASSETS"

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        target_commitish: ${{ github.sha }}
        name: TinyWall ${{ steps.version.outputs.version }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: ${{ steps.package.outputs.files }}
