name: .NET 10 Desktop

on:
  push:
    branches: [ "upgrade-to-NET10", "master" ]
  pull_request:
    branches: [ "upgrade-to-NET10", "master" ]

permissions:
  contents: read

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Validate MSI project and application packaging checks
      shell: pwsh
      run: .\installer\build-package.ps1 -SelfTest

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Build Modern TinyWall
      run: dotnet build ModernTinyWall\ModernTinyWall.csproj --configuration ${{ matrix.configuration }}

    - name: Build TinyWall
      run: msbuild TinyWall\TinyWall.csproj /restore /p:Configuration=${{ matrix.configuration }} /p:Platform="Any CPU"

    - name: Test
      run: dotnet test ModernTinyWall.Exceptions.Tests\ModernTinyWall.Exceptions.Tests.csproj --configuration ${{ matrix.configuration }} --filter 'TestCategory!=LiveETW'

  installer:
    needs: build
    # This image includes Visual Studio 2026 and the Visual Studio Installer Projects extension.
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Allow command-line Installer Projects builds
      shell: pwsh
      run: ./installer/enable-ci-msi-build.ps1

    - name: Build and validate MSI (not installed)
      id: msi
      shell: pwsh
      run: |
        .\installer\build-msi.ps1
        [xml]$project = Get-Content ModernTinyWall\ModernTinyWall.csproj -Raw
        $version = $project.Project.PropertyGroup |
          Where-Object { $_.Version } |
          Select-Object -First 1 -ExpandProperty Version
        $name = "ModernTinyWall-$version-win-x64.msi"
        $output = Join-Path artifacts\installer $name
        Copy-Item TinyWallSetup\Release\TinyWallSetup.msi $output -Force
        $hash = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash
        Set-Content -LiteralPath "$output.sha256" -Value "$hash  $name" -Encoding ascii
        Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$name"

    - name: Upload MSI artefact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.msi.outputs.name }}
        path: |
          artifacts/installer/*.msi
          artifacts/installer/*.msi.sha256
        if-no-files-found: error

  release:
    needs: [build, installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Read and validate release version
      id: version
      shell: pwsh
      run: |
        [xml]$project = Get-Content ModernTinyWall\ModernTinyWall.csproj -Raw
        $version = $project.Project.PropertyGroup |
          Where-Object { $_.Version } |
          Select-Object -First 1 -ExpandProperty Version
        if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
          throw "ModernTinyWall.csproj must define a valid release version."
        }

        foreach ($projectFile in Get-ChildItem -Path . -Filter *.csproj -Recurse) {
          [xml]$library = Get-Content $projectFile.FullName -Raw
          if ($library.Project.PropertyGroup.IsPackable -contains 'false') {
            continue
          }
          $projectVersions = @($library.SelectNodes('/Project/PropertyGroup/Version') |
            ForEach-Object { $_.InnerText.Trim() } | Select-Object -Unique)
          if ($projectVersions.Count -ne 1 -or $projectVersions[0] -ne $version) {
            throw "$($projectFile.Name) must define exactly one release version '$version', not '$($projectVersions -join ', ')'."
          }
        }

        $existingTag = git tag --list $version
        if ($existingTag) {
          $tagCommit = git rev-list -n 1 $version
          if ($tagCommit -ne $env:GITHUB_SHA) {
            throw "Release tag '$version' already points to another commit. Bump the project version before releasing again."
          }
        }

        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

    - name: Download MSI artefact
      uses: actions/download-artifact@v4
      with:
        pattern: ModernTinyWall-*.msi
        path: artifacts/msi
        merge-multiple: true

    - name: Publish application archives and MSI
      id: package
      shell: pwsh
      run: |
        .\installer\build-package.ps1 -Architecture All
        $assets = @(
          Get-ChildItem artifacts\release\*.zip -File | ForEach-Object { $_.FullName }
          Get-ChildItem artifacts\release\*.zip.sha256 -File | ForEach-Object { $_.FullName }
          Get-ChildItem artifacts\msi\*.msi -File | ForEach-Object { $_.FullName }
          Get-ChildItem artifacts\msi\*.msi.sha256 -File | ForEach-Object { $_.FullName }
        )
        if (-not (Get-ChildItem artifacts\msi\*.msi -File)) {
          throw "The MSI artefact is missing."
        }
        if (-not $assets) {
          throw "Packaging produced no release assets."
        }
        Add-Content -Path $env:GITHUB_OUTPUT -Value "files<<ASSETS"
        $assets | ForEach-Object { Add-Content -Path $env:GITHUB_OUTPUT -Value $_ }
        Add-Content -Path $env:GITHUB_OUTPUT -Value "ASSETS"

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        target_commitish: ${{ github.sha }}
        name: TinyWall ${{ steps.version.outputs.version }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: ${{ steps.package.outputs.files }}
